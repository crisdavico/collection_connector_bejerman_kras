# Hooks for this single-addon repository. They mirror the seedian parent
# `.pre-commit-config.yaml`: same hook revisions and the same ruff, prettier and pylint
# settings, with paths anchored for an addon that lives at the repository root.
# Prettier keeps its 2-space default: the parent's `.editorconfig` lies outside this
# repository's project root, so it never applied to this code.
exclude: |
  (?x)
  # Files and folders generated by bots, to avoid loops
  (^|/)static/description/index\.html$|
  # Files that fail if changed manually
  .*\.(diff|patch)$|
  # Library files can have extraneous formatting (even minimized)
  (^|/)static/(src/)?lib/|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)
default_language_version:
  python: python3
  node: "18.17.1"
repos:
  - repo: local
    hooks:
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.6
    hooks:
      - id: oca-checks-odoo-module
        # The upstream pattern only matches a manifest below a folder
        files: \.(csv|xml)$|(^|/)__(manifest|openerp)__\.py$
      - id: oca-checks-po
        args: ["--fix"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    # HACK https://github.com/prettier/prettier/issues/15696
    rev: v2.7.1
    hooks:
      - id: prettier
        name: prettier + plugin-xml
        args: [--plugin=@prettier/plugin-xml]
        additional_dependencies:
          # HACK https://github.com/prettier/pre-commit/issues/16#issuecomment-713474520
          - prettier@2.7.1
          - "@prettier/plugin-xml@v2.2.0"
        # Planning docs keep their authored wrapping; reflowing them is churn only
        exclude: ^(odd|openspec)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        args: [--assume-in-merge]
        exclude: \.rst$ # HACK https://github.com/pre-commit/pre-commit-hooks/issues/985
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.15
    hooks:
      - id: pylint_odoo
        name: pylint with optional checks
        args:
          - --rcfile=.pylintrc
          - --exit-zero
        verbose: true
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc-mandatory
  - repo: https://github.com/oca/maintainer-tools
    rev: f9b919b9868143135a9c9cb03021089cabba8223
    hooks:
      # Generate readme is last, so its digest includes changes from above
      - id: oca-gen-addon-readme
        args:
          - --addon-dir=.
          - --org-name=Eynes
          - --repo-name=l10n-v19-testing
          - --convert-fragments-to-markdown
          - --gen-html
          - --if-fragments-changed
          - --branch=19.0
          # A copy of the seedian parent's template, so the hook runs standalone
          - --template-filename=.module-readme.rst.j2
